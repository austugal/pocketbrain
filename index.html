<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PocketBrain — Your notes, connected</title><style>
*{box-sizing:border-box}body{margin:0;background:#101724;color:#e5edf8;font:16px system-ui}header,main{max-width:1100px;margin:auto;padding:28px}header{display:flex;justify-content:space-between;align-items:center}h1{margin:0;font-size:30px}small,p{color:#adbed4}button,input{font:inherit;border-radius:10px;padding:12px;border:1px solid #405674;background:#1b2a40;color:inherit}button{cursor:pointer}button:hover{background:#304867}input[type=search]{width:100%;margin:20px 0}section{display:grid;grid-template-columns:280px 1fr;gap:24px}aside button{display:block;width:100%;text-align:left;margin:8px 0}article{background:#182338;border:1px solid #334961;border-radius:18px;padding:25px;min-height:340px}pre{white-space:pre-wrap;font:inherit;line-height:1.7}nav{display:flex;gap:8px;flex-wrap:wrap}.tag{display:inline-block;padding:8px;margin:5px;background:#263b56;border-radius:8px}label{display:block;margin-top:20px}#status{min-height:24px}footer{padding:25px;text-align:center;color:#adbed4}a{color:#9bc9ff}@media(max-width:650px){section{grid-template-columns:1fr}header{display:block}aside{max-height:200px;overflow:auto}}
dialog{background:#182338;color:#e5edf8;border:1px solid #65758c;border-radius:18px;width:min(600px,95vw)}dialog::backdrop{background:#000a}textarea{display:block;width:100%;font:inherit;background:#101724;color:#e5edf8;padding:14px;border:1px solid #405674;border-radius:8px}label input{display:block;width:100%}svg{width:100%;min-height:320px}svg text{font:13px system-ui;fill:#e5edf8}svg g{cursor:pointer}svg g:focus{outline:none}svg g:focus circle{stroke:#fff;stroke-width:4}header h1{letter-spacing:-1.5px;font-size:42px}body{background:radial-gradient(ellipse at top right,#28334e,transparent 60%),#101724}article{box-shadow:0 20px 70px #0004}#graph{border-color:#aaa1ef;background:#393461}</style><header><div><h1>PocketBrain</h1><p>Your notes, connected. Your knowledge, reusable.</p></div><span>By Tiago Fitas</span></header><main><nav><button id="import">Import notes</button><button id="sample">Load demo</button><button id="graph">Knowledge map</button><button id="write">Create note</button><button id="cards">Revision cards</button><button id="export">Export notes</button><button id="clear">Clear workspace</button></nav><input id="files" type="file" multiple accept=".md,.txt,.json" hidden><input id="search" type="search" aria-label="Search notes" placeholder="Search titles, ideas or tags…"><p id="status" role="status">No accounts. No uploads. Notes stay in this tab until you export them.</p><section><aside id="list" aria-label="Notes"></aside><article id="detail"></article></section></main><dialog id="editor"><form method="dialog"><h2>Create a note</h2><label>Title<input id="note-title" required maxlength="200"></label><label>Note<textarea id="note-body" rows="10" required></textarea></label><button id="save-note" value="save">Save note</button><button value="cancel" formnovalidate>Cancel</button></form></dialog><footer>Independent open-source experiment. No AI service or external requests. Revision cards are extracted from your notes.</footer><script>
'use strict';let notes=[],selected=0;const $=id=>document.getElementById(id);function el(tag,text){const e=document.createElement(tag);e.textContent=text;return e}function title(s,f){return s.match(/^#\s+(.+)$/m)?.[1]||f.replace(/\.(md|txt)$/i,'')}function words(s){return new Set((s.toLowerCase().match(/[a-z]{4,}/g)||[]).filter(w=>!['this','that','with','from','have','your','notes','into','they','will'].includes(w)))}function related(n){const a=words(n.text);return notes.map((x,i)=>({x,i,score:[...words(x.text)].filter(w=>a.has(w)).length})).filter(v=>v.x!==n&&v.score>1).sort((a,b)=>b.score-a.score).slice(0,5)}function render(){const q=$('search').value.toLowerCase();$('list').replaceChildren();notes.forEach((n,i)=>{if((n.title+' '+n.text).toLowerCase().includes(q)){const b=el('button',n.title);b.onclick=()=>{selected=i;show()};$('list').append(b)}});show()}function show(){const d=$('detail');d.replaceChildren();const n=notes[selected];if(!n){d.append(el('h2','Start with an idea'),el('p','Import Markdown or text files, or load the demo to explore connected knowledge.'));return}d.append(el('h2',n.title),el('pre',n.text),el('h3','Connected notes'));const links=related(n);if(!links.length)d.append(el('p','No strong shared terms yet.'));links.forEach(v=>{const b=el('button',v.x.title+' · '+v.score+' shared terms');b.className='tag';b.onclick=()=>{selected=v.i;show()};d.append(b)});d.append(el('small','Connections use shared words, not semantic AI.'))}function status(t){$('status').textContent=t}$('search').oninput=render;$('import').onclick=()=>$('files').click();$('files').onchange=async e=>{let count=0;for(const f of e.target.files){if(!/\.(md|txt|json)$/i.test(f.name)||f.size>1024*1024){status('Skipped unsupported file or file larger than 1 MB: '+f.name);continue}const text=await f.text();if(/\.json$/i.test(f.name)){try{const a=JSON.parse(text);if(a.format!=='pocketbrain-v1'||!Array.isArray(a.notes)||a.notes.length>1000||!a.notes.every(n=>typeof n.title==='string'&&typeof n.text==='string'))throw Error();notes.push(...a.notes);count+=a.notes.length}catch{status('Invalid PocketBrain archive: '+f.name)}continue}notes.push({title:title(text,f.name),text});count++}render();status(count+' notes imported locally. Export before closing this tab.');e.target.value=''};$('sample').onclick=()=>{notes=[{title:'Learning that lasts',text:'# Learning that lasts\n\nRetrieval practice strengthens learning: recall an idea before reading the answer.\n\nSpaced repetition means revisiting knowledge over time.\n\nConnect related notes to discover useful patterns.'},{title:'A practical second brain',text:'# A practical second brain\n\nCapture ideas in short notes. Connect related knowledge with shared terms.\n\nUse retrieval practice and spaced repetition to revisit useful ideas.\n\nExport your notes so your knowledge remains portable.'},{title:'Building useful software',text:'# Building useful software\n\nStart with a specific problem and a small working demo.\n\nExplain data handling clearly. Keep knowledge portable through export.\n\nUse feedback to improve the software.'}];selected=0;render();status('Demo loaded. These sample notes illustrate the interface.')};$('cards').onclick=()=>{const n=notes[selected];if(!n)return status('Load or import notes first.');const lines=n.text.split(/\n+/).filter(l=>l.trim()&&!l.startsWith('#'));const d=$('detail');d.replaceChildren(el('h2','Recall: '+n.title),el('p','Explain one key idea from this note before revealing a passage.'));lines.forEach((line,i)=>{const b=el('button','Reveal passage '+(i+1));b.onclick=()=>b.replaceWith(el('p',line));d.append(b,el('br',''))});d.append(el('small','Extracted passages, not generated questions.'))};$('export').onclick=()=>{const blob=new Blob([JSON.stringify({format:'pocketbrain-v1',notes},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='pocketbrain-notes.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);status('Export downloaded. Keep it before clearing or closing the workspace.')};$('clear').onclick=()=>{if(confirm('Clear notes in this tab? Export first if needed.')){notes=[];selected=0;render();status('Workspace cleared.')}};
$('write').onclick=()=>$('editor').showModal();$('editor').onclose=()=>{if($('editor').returnValue==='save'){notes.push({title:$('note-title').value.trim()||'Untitled',text:$('note-body').value});selected=notes.length-1;render();$('note-title').value='';$('note-body').value='';status('Note created. Export to keep it.')}};
$('graph').onclick=()=>{const d=$('detail');d.replaceChildren(el('h2','Knowledge map'),el('p','Lines join notes with at least two shared terms. Select a node to open its note.'));if(!notes.length)return;const ns='http://www.w3.org/2000/svg',svg=document.createElementNS(ns,'svg');svg.setAttribute('viewBox','0 0 700 480');svg.setAttribute('role','img');svg.setAttribute('aria-label','Connected notes graph');const shown=notes.slice(0,24),pts=shown.map((n,i)=>({x:350+230*Math.cos(i/shown.length*Math.PI*2),y:240+175*Math.sin(i/shown.length*Math.PI*2)}));shown.forEach((n,i)=>related(n).filter(v=>v.i>i&&v.i<shown.length).forEach(v=>{const l=document.createElementNS(ns,'line');l.setAttribute('x1',pts[i].x);l.setAttribute('y1',pts[i].y);l.setAttribute('x2',pts[v.i].x);l.setAttribute('y2',pts[v.i].y);l.setAttribute('stroke','#687aab');l.setAttribute('stroke-width','2');svg.append(l)}));shown.forEach((n,i)=>{const g=document.createElementNS(ns,'g');g.setAttribute('tabindex','0');g.setAttribute('role','button');g.setAttribute('aria-label',n.title);const c=document.createElementNS(ns,'circle');c.setAttribute('cx',pts[i].x);c.setAttribute('cy',pts[i].y);c.setAttribute('r','15');c.setAttribute('fill','#b3a8f5');const text=document.createElementNS(ns,'text');text.setAttribute('x',pts[i].x);text.setAttribute('y',pts[i].y+32);text.setAttribute('text-anchor','middle');text.textContent=n.title.slice(0,22);g.append(c,text);g.onclick=()=>{selected=i;show()};g.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();g.onclick()}};svg.append(g)});d.append(svg);if(notes.length>24)d.append(el('p','Map shows the first 24 notes. All notes remain searchable.'))};
render();
</script></html>
